name: JazzChords
options:
  bundleIdPrefix: app.jazzchords
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MusicEngine:
    path: ../MusicEngine

targets:
  JazzChords:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JazzChords
    dependencies:
      - package: MusicEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jazzchords.trainer
        DEVELOPMENT_TEAM: "3YB2KJCCHV"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: JazzChords/Info.plist
      properties:
        CFBundleDisplayName: jazzchords
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "jazzchords listens to your piano so it can recognise the chords you play."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
