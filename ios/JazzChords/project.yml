name: JazzChords
options:
  bundleIdPrefix: app.jazzchords
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MusicEngine:
    path: ../MusicEngine

targets:
  JazzChords:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JazzChords
    dependencies:
      - package: MusicEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jazzchords.trainer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: jazzchords
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "jazzchords listens to your piano so it can recognise the chords you play."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
