name: JazzChords
options:
  bundleIdPrefix: app.jazzchords
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MusicEngine:
    path: ../MusicEngine
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  JazzChords:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JazzChords
    dependencies:
      - package: MusicEngine
      - package: Supabase
        product: Supabase
    entitlements:
      path: JazzChords/JazzChords.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jazzchords.trainer
        DEVELOPMENT_TEAM: "FDVWAWJYV5"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: JazzChords/Info.plist
      properties:
        CFBundleDisplayName: JazzChords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: "JazzChords listens to your piano so it can recognise the chords you play. Audio is analysed on your device and never recorded or uploaded."
        NSBluetoothAlwaysUsageDescription: "JazzChords connects to Bluetooth MIDI keyboards so you can play along."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Kalam-Bold.ttf

  JazzChordsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JazzChordsTests
    dependencies:
      - target: JazzChords
      - package: MusicEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "FDVWAWJYV5"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/JazzChords.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JazzChords
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  JazzChords:
    build:
      targets:
        JazzChords: all
        JazzChordsTests: [test]
    test:
      targets:
        - JazzChordsTests
