<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jazzchords.app — Design-Varianten</title>
<style>
  :root {
    --bar-bg: #14121c;
    --bar-line: #2a2636;
    --ink: #f2efe9;
    --ink-dim: #9a93a8;
    --accent: #f5a623;
    --bar-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0912; }
  body {
    font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  .bar {
    height: var(--bar-h);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 0 1rem;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-line);
    position: relative;
    z-index: 2;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .brand b { color: var(--ink); font-weight: 600; }

  .seg { display: flex; gap: 4px; background: #0f0d17; border: 1px solid var(--bar-line); border-radius: 999px; padding: 3px; }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s ease, color .18s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1a1206; font-weight: 700; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .spacer { flex: 1 1 auto; }

  .size { display: flex; gap: 4px; }
  .size button {
    appearance: none;
    border: 1px solid var(--bar-line);
    background: #0f0d17;
    color: var(--ink-dim);
    font: inherit; font-size: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .size button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }
  .size button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }

  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    place-items: start center;
    overflow: auto;
    background:
      repeating-linear-gradient(45deg, #0d0b14 0 12px, #0b0912 12px 24px);
  }
  .frame-wrap {
    /* Desktop: fill. Mobile/tablet: a centred device-width column. */
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .frame-wrap[data-size="mobile"], .frame-wrap[data-size="tablet"] { padding: 18px 0; align-items: start; }
  iframe {
    border: 0;
    background: #0b0912;
    width: 100%;
    height: 100%;
    display: block;
  }
  .frame-wrap[data-size="mobile"] iframe { width: 375px; height: 812px; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .frame-wrap[data-size="tablet"] iframe { width: 834px; height: 1000px; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

  /* Narrow windows: the bar must never clip the size buttons — they're how
     you check mobile. Drop the labels, keep every control reachable. */
  @media (max-width: 900px) {
    .brand, .note { display: none; }
  }
  @media (max-width: 760px) {
    :root { --bar-h: auto; }
    .bar { flex-wrap: wrap; gap: .5rem; padding: .5rem .75rem; }
    .spacer { display: none; }
    .seg button { padding: 6px 10px; font-size: 12px; }
    .size { margin-left: auto; }
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand"><b>jazzchords</b> · Design-Varianten</span>

    <div class="seg" role="group" aria-label="Variante wählen">
      <button data-variant="variant-a.html" aria-pressed="true">A · Konzertsaal</button>
      <button data-variant="variant-b.html" aria-pressed="false">B · Studio</button>
      <button data-variant="variant-c.html" aria-pressed="false">C · Notenblatt</button>
    </div>

    <span class="spacer"></span>

    <div class="size" role="group" aria-label="Bildschirmgröße">
      <button data-size="mobile" aria-pressed="false">Mobil</button>
      <button data-size="tablet" aria-pressed="false">Tablet</button>
      <button data-size="desktop" aria-pressed="true">Desktop</button>
    </div>

    <span class="note">Jede Variante hat oben eigene Seiten-Tabs</span>
  </div>

  <div class="stage">
    <div class="frame-wrap" id="wrap" data-size="desktop">
      <iframe id="view" src="variant-a.html" title="Design-Variante"></iframe>
    </div>
  </div>

<script>
  const view = document.getElementById('view');
  const wrap = document.getElementById('wrap');

  function group(sel, attr, apply) {
    const btns = [...document.querySelectorAll(sel)];
    for (const b of btns) {
      b.addEventListener('click', () => {
        for (const o of btns) o.setAttribute('aria-pressed', String(o === b));
        apply(b.dataset[attr]);
      });
    }
  }

  group('.seg button', 'variant', (src) => {
    // Keep the chosen size when switching variants.
    view.src = src;
  });

  group('.size button', 'size', (size) => {
    wrap.dataset.size = size;
  });

  // Keyboard: 1/2/3 switch variants — quicker than aiming at the bar.
  addEventListener('keydown', (e) => {
    if (e.target !== document.body) return;
    const i = ['1', '2', '3'].indexOf(e.key);
    if (i >= 0) document.querySelectorAll('.seg button')[i].click();
  });
</script>
</body>
</html>
